openapi: 3.0.3
info:
  title: 써랍 API 설계 명세
  version: 1.3.0
  description: 써랍의 기본 이력, 경력, 경험, 자소서 작성, 검토 요청 기능을 정의합니다. 로그인한 사용자는 본인 데이터와 자신이 작성자 또는 검토자로 참여한 검토 요청에만 접근합니다.
    시간 응답은 UTC ISO-8601을 사용하고 화면에서는 Asia/Seoul로 표시합니다. PUT은 전체 대체이며 선택값은 null로 전달합니다. 검토자는 자소서 본문을 수정할 수 없고 문항별
    메모만 작성할 수 있습니다.
servers:
  - url: http://localhost:8080/api/v1
    description: 써랍 API 서버
tags:
  - name: 인증
  - name: 사용자
  - name: 기본 이력
  - name: 학력
  - name: 수강 과목
  - name: 자격증
  - name: 어학
  - name: 경력
  - name: 경험
  - name: 자소서
  - name: 문항
  - name: 버전
  - name: 검토
  - name: 추천
paths:
  /auth/login:
    post:
      tags:
        - 인증
      summary: 계정 선택 로그인
      operationId: post__auth__login
      description: 등록된 사용자 ID로 로그인 세션을 시작한다. 성공 시 현재 사용자 정보를 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              userId: 1
      responses:
        "200":
          description: 로그인한 사용자
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
  /auth/logout:
    post:
      tags:
        - 인증
      summary: 로그아웃
      operationId: post__auth__logout
      description: 현재 로그인 세션을 종료한다.
      responses:
        "204":
          description: 로그아웃 완료
        "500":
          $ref: "#/components/responses/Error500"
  /reviewers:
    get:
      tags:
        - 사용자
        - 검토
      summary: 선택 가능한 검토자 목록
      operationId: get__reviewers
      description: 현재 사용자를 제외하고 검토자로 지정할 수 있는 사용자 목록을 표시명 오름차순으로 반환한다.
      responses:
        "200":
          description: 검토자 후보 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "500":
          $ref: "#/components/responses/Error500"
  /me:
    get:
      tags:
        - 사용자
      summary: 현재 로그인 사용자 조회
      operationId: get__me
      description: 현재 로그인 세션의 사용자 정보를 반환한다.
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error400"
        "500":
          $ref: "#/components/responses/Error500"
  /me/resume:
    get:
      tags:
        - 기본 이력
      summary: 기본 이력 전체 조회
      operationId: get__me_resume
      description: 기본 이력 화면 초기 조회. 학력, 수강 과목, 자격증, 어학 성적을 함께 반환한다. 경력은 /careers에서 조회한다. 값이 없으면 배열은 [], 프로필은 UNSPECIFIED/null을 사용한다.
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "400":
          $ref: "#/components/responses/Error400"
        "500":
          $ref: "#/components/responses/Error500"
  /me/profile:
    get:
      tags:
        - 기본 이력
      summary: 병역·보훈·장애사항 조회
      operationId: get__me_profile
      description: 병역·보훈·장애사항 조회
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error400"
        "500":
          $ref: "#/components/responses/Error500"
    put:
      tags:
        - 기본 이력
      summary: 병역·보훈·장애사항 전체 저장
      operationId: put__me_profile
      description: 모든 속성을 보내는 전체 대체 저장. 선택 문자열은 빈 값 대신 null. 추천 서비스에 전달하지 않음.
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error400"
        "500":
          $ref: "#/components/responses/Error500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileWrite"
            example:
              militaryStatus: UNSPECIFIED
              militaryBranch: null
              militaryRank: null
              militaryStartMonth: null
              militaryEndMonth: null
              veteranStatus: UNSPECIFIED
              disabilityStatus: UNSPECIFIED
              additionalInfo: null
  /educations:
    get:
      tags:
        - 학력
      summary: 학력 목록 조회
      operationId: get__educations
      description: "본인 데이터 전체 목록. 최신 수정순(updatedAt DESC, id DESC). "
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Education"
        "400":
          $ref: "#/components/responses/Error400"
        "500":
          $ref: "#/components/responses/Error500"
    post:
      tags:
        - 학력
      summary: 학력 등록
      operationId: post__educations
      description: 본인 소유로 생성. 필수값·기간·항목별 제약을 검증.
      responses:
        "201":
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Education"
        "400":
          $ref: "#/components/responses/Error400"
        "500":
          $ref: "#/components/responses/Error500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EducationWrite"
            example:
              schoolName: 예시대학교
              major: 컴퓨터공학
              educationStatus: GRADUATED
              startMonth: 2021-03
              endMonth: 2025-02
              gpa: 3.8
              gpaScale: 4.5
  /educations/{id}:
    get:
      tags:
        - 학력
      summary: 학력 상세 조회
      operationId: get__educations__id
      description: 학력 상세 조회
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Education"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - name: id
          in: path
          required: true
          description: id
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
    put:
      tags:
        - 학력
      summary: 학력 수정
      operationId: put__educations__id
      description: 모든 쓰기 속성을 보내는 전체 대체 저장. 누락은 400. 다른 사용자 소유는 404.
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Education"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - name: id
          in: path
          required: true
          description: id
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EducationWrite"
            example:
              schoolName: 예시대학교
              major: 컴퓨터공학
              educationStatus: GRADUATED
              startMonth: 2021-03
              endMonth: 2025-02
              gpa: 3.8
              gpaScale: 4.5
    delete:
      tags:
        - 학력
      summary: 학력 삭제
      operationId: delete__educations__id
      description: 본인 소유 학력과 연결된 수강 과목을 함께 삭제한다. 미존재하거나 다른 사용자 소유이면 404로 응답한다.
      responses:
        "204":
          description: 처리 완료. 응답 본문 없음
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - name: id
          in: path
          required: true
          description: id
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
  /educations/{educationId}/courses:
    get:
      tags:
        - 수강 과목
      summary: 학력별 수강 과목 목록 조회
      operationId: get__educations__educationId__courses
      description: 본인 학력에 등록된 수강 과목을 position ASC, id ASC 순서로 반환한다.
      parameters:
        - name: educationId
          in: path
          required: true
          description: 학력 ID
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
      responses:
        "200":
          description: 수강 과목 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
    post:
      tags:
        - 수강 과목
      summary: 수강 과목 등록
      operationId: post__educations__educationId__courses
      description: 본인 학력에 수강 과목을 등록한다. 같은 학력 안에서 position은 중복될 수 없다.
      parameters:
        - name: educationId
          in: path
          required: true
          description: 학력 ID
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseWrite"
            example:
              majorName: 컴퓨터공학
              studyYear: 2025
              semester: FIRST_SEMESTER
              subjectName: 데이터베이스
              subjectType: MAJOR
              credits: 3
              grade: A+
              retaken: false
              position: 1
      responses:
        "201":
          description: 등록된 수강 과목
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  /courses/{courseId}:
    get:
      tags:
        - 수강 과목
      summary: 수강 과목 상세 조회
      operationId: get__courses__courseId
      description: 본인 학력에 속한 수강 과목을 조회한다.
      parameters:
        - name: courseId
          in: path
          required: true
          description: 수강 과목 ID
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
      responses:
        "200":
          description: 수강 과목 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
    put:
      tags:
        - 수강 과목
      summary: 수강 과목 수정
      operationId: put__courses__courseId
      description: 모든 쓰기 속성을 보내 수강 과목을 전체 대체한다. 다른 사용자 소유는 404로 응답한다.
      parameters:
        - name: courseId
          in: path
          required: true
          description: 수강 과목 ID
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseWrite"
      responses:
        "200":
          description: 수정된 수강 과목
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
    delete:
      tags:
        - 수강 과목
      summary: 수강 과목 삭제
      operationId: delete__courses__courseId
      description: 본인 학력에 속한 수강 과목을 삭제한다.
      parameters:
        - name: courseId
          in: path
          required: true
          description: 수강 과목 ID
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
      responses:
        "204":
          description: 삭제 완료
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
  /certifications:
    get:
      tags:
        - 자격증
      summary: 자격증 목록 조회
      operationId: get__certifications
      description: "본인 데이터 전체 목록. 최신 수정순(updatedAt DESC, id DESC). "
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certification"
        "400":
          $ref: "#/components/responses/Error400"
        "500":
          $ref: "#/components/responses/Error500"
    post:
      tags:
        - 자격증
      summary: 자격증 등록
      operationId: post__certifications
      description: 본인 소유로 생성. 필수값·기간·항목별 제약을 검증.
      responses:
        "201":
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"
        "400":
          $ref: "#/components/responses/Error400"
        "500":
          $ref: "#/components/responses/Error500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificationWrite"
            example:
              name: 예시 자격증
              issuer: 예시 기관
              acquiredOn: 2025-06-01
              certificateNumber: null
  /certifications/{id}:
    get:
      tags:
        - 자격증
      summary: 자격증 상세 조회
      operationId: get__certifications__id
      description: 자격증 상세 조회
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - name: id
          in: path
          required: true
          description: id
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
    put:
      tags:
        - 자격증
      summary: 자격증 수정
      operationId: put__certifications__id
      description: 모든 쓰기 속성을 보내는 전체 대체 저장. 누락은 400. 다른 사용자 소유는 404.
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - name: id
          in: path
          required: true
          description: id
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificationWrite"
            example:
              name: 예시 자격증
              issuer: 예시 기관
              acquiredOn: 2025-06-01
              certificateNumber: null
    delete:
      tags:
        - 자격증
      summary: 자격증 삭제
      operationId: delete__certifications__id
      description: 본인 소유 리소스 하드 삭제. 미존재/다른 사용자 소유는 404. 경력 삭제는 경험 연결만 해제; 경험 삭제는 문항 연결만 삭제하고 답변 유지; 자소서 삭제는 문항과 참고
        연결 함께 삭제.
      responses:
        "204":
          description: 처리 완료. 응답 본문 없음
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - name: id
          in: path
          required: true
          description: id
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
  /language-scores:
    get:
      tags:
        - 어학
      summary: 어학 목록 조회
      operationId: get__language_scores
      description: "본인 데이터 전체 목록. 최신 수정순(updatedAt DESC, id DESC). "
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LanguageScore"
        "400":
          $ref: "#/components/responses/Error400"
        "500":
          $ref: "#/components/responses/Error500"
    post:
      tags:
        - 어학
      summary: 어학 등록
      operationId: post__language_scores
      description: 본인 소유로 생성. 필수값·기간·항목별 제약을 검증.
      responses:
        "201":
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageScore"
        "400":
          $ref: "#/components/responses/Error400"
        "500":
          $ref: "#/components/responses/Error500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LanguageScoreWrite"
            example:
              testName: 예시 어학시험
              scoreOrGrade: IH
              testedOn: 2025-06-01
              expiresOn: 2027-06-01
  /language-scores/{id}:
    get:
      tags:
        - 어학
      summary: 어학 상세 조회
      operationId: get__language_scores__id
      description: 어학 상세 조회
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguageScore"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - name: id
          in: path
          required: true
          description: id
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
    put:
      tags:
        - 어학
      summary: 어학 수정
