      description: 자소서 소유자만 조회한다. COMPLETED 검토 요청의 메모를 문항별로 반환하며 작성 화면 자료 서랍의 검토 메모 탭에서 사용한다. 진행 중 메모는 노출하지 않는다.
      parameters:
        - name: id
          in: path
          required: true
          description: applicationId
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
        - name: questionId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
      responses:
        "200":
          description: 완료된 검토 메모 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewFeedback"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
  /experience-recommendations:
    post:
      tags:
        - 추천
      summary: 문항 기반 경험 추천
      operationId: post__experience_recommendations
      description: 문항과 본인이 저장한 경험의 내용·태그를 비교해 관련 경험을 반환한다. 응답의 mode로 TAG_MATCH와 AI 추천 방식을 구분한다. 병역·보훈·장애사항은 추천 입력에서 제외하며
        자소서 답변을 생성하거나 변경하지 않는다. 추천 결과가 없으면 items는 빈 배열이다.
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
              example:
                mode: TAG_MATCH
                items:
                  - experienceId: 3
                    title: 의견의 차이를 하나의 방향으로
                    reason: 문항의 협업 키워드와 연결된 경험입니다.
                    keywords:
                      - 협업
                    followUpQuestions:
                      - 본인이 직접 한 행동은 무엇인가요?
        "400":
          $ref: "#/components/responses/Error400"
        "500":
          $ref: "#/components/responses/Error500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationRequest"
            example:
              prompt: 협업 경험을 소개해주세요.
              limit: 3
