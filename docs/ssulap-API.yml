openapi: 3.0.3
info:
  title: 써랍 API 설계 명세
  version: 1.0.0
  description: 설계 산출물이며 백엔드는 아직 구현되지 않았습니다. 기본 CRUD는 구현 예정, 경험 추천은 확장 계약입니다. 로컬 개발용 고정 사용자만 사용하며 인증 스키마는 범위
    밖입니다. 본인 데이터에만 접근하며 요청 body에 userId는 받지 않습니다. 시간 응답은 UTC ISO-8601, 화면 표시는 Asia/Seoul. PUT은 전체 대체이며 선택값은
    null로 보냅니다. 단일 사용자 로컬 시연만 허용하고 인증 없는 외부 공개 운영은 범위 밖입니다.
servers:
  - url: http://localhost:8080/api/v1
    description: 향후 구현할 로컬 백엔드 (현재 실행되지 않음)
tags:
  - name: 사용자
  - name: 기본 이력
  - name: 학력
  - name: 자격증
  - name: 어학
  - name: 경력
  - name: 경험
  - name: 자소서
  - name: 문항
  - name: 추천
paths:
  /me:
    get:
      tags:
        - 사용자
      summary: 현재 개발용 사용자 조회
      operationId: get__me
      description: 로컬 프로필에서 고정 사용자 1을 사용. 사용자 ID를 요청으로 받지 않음. 인증 구현 완료를 의미하지 않음.
      x-implementation-status: planned-not-implemented
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error400"
        "500":
          $ref: "#/components/responses/Error500"
  /me/resume:
    get:
      tags:
        - 기본 이력
      summary: 기본 이력 전체 조회·복사용
