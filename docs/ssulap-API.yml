      description: 기본 이력 화면 초기 조회. 경력은 /careers에서 조회. 값이 없으면 배열은 [], 프로필은 UNSPECIFIED/null. 복사는 브라우저 기능이며 별도 쓰기 API 없음.
      x-implementation-status: planned-not-implemented
      responses:
        "200":
          description: 정상 처리
          content:
            application/json:
              schema:
